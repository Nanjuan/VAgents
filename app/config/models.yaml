models:
  # ── LM Studio (OpenAI-compatible, http://localhost:1234/v1) ───────────────
  # model_id must match the model name shown in LM Studio's model selector.
  # "Use" button in the UI overrides model_id at runtime.
  lmstudio-default:
    provider: lmstudio
    model_id: lmstudio          # placeholder — LM Studio uses whatever is loaded
    max_tokens: 131072
    temperature: 0.7
    supports_tools: true
    timeout_seconds: 300

  # ── Local 70B models via Ollama (requires ~40GB VRAM at Q4) ──────────────
  local-llama70b:
    provider: ollama
    model_id: llama3.3:70b
    max_tokens: 8192
    temperature: 0.7
    context_length: 32768
    supports_tools: true
    timeout_seconds: 300

  local-qwen72b:
    provider: ollama
    model_id: qwen2.5:72b
    max_tokens: 8192
    temperature: 0.7
    context_length: 32768
    supports_tools: true
    timeout_seconds: 300

  local-deepseek70b:
    provider: ollama
    model_id: deepseek-r1:70b
    max_tokens: 8192
    temperature: 0.6
    context_length: 32768
    supports_tools: false
    timeout_seconds: 480

  # ── Smaller local models (fallback / fast) ────────────────────────────────
  local-default:
    provider: ollama
    model_id: llama3.2
    max_tokens: 4096
    temperature: 0.7
    context_length: 8192
    supports_tools: false
    timeout_seconds: 120

  # ── Paid API models ───────────────────────────────────────────────────────
  paid-anthropic:
    provider: anthropic
    model_id: claude-sonnet-4-6
    max_tokens: 8192
    temperature: 0.7

  paid-openai:
    provider: openai
    model_id: gpt-4o
    max_tokens: 8192
    temperature: 0.7
