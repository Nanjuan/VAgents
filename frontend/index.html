<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAgents</title>
  <link rel="stylesheet" href="/ui/style.css?v=6" />
</head>
<body>
<div id="app">

  <aside id="sidebar">

    <div id="sidebar-top">
      <span id="logo">VAgents</span>
    </div>

    <nav id="sidebar-tabs" role="tablist">
      <button id="tab-chat" class="tab active" role="tab">Chats</button>
      <button id="tab-tools" class="tab" role="tab">Tools</button>
    </nav>

    <div id="chat-panel" class="sidebar-panel">

      <div id="new-chat-bar">
        <button id="new-chat-btn">+ New chat</button>
      </div>

      <div id="new-chat-form" class="hidden">
        <input id="new-chat-name" type="text" placeholder="Chat name" maxlength="60" />
        <select id="new-chat-profile"></select>
        <div id="new-chat-actions">
          <button id="new-chat-confirm">Create</button>
          <button id="new-chat-cancel">Cancel</button>
        </div>
      </div>

      <div id="chat-list"></div>

      <div id="lmstudio-panel">
        <div id="lmstudio-header">
          <div class="lms-label-row">
            <div id="lms-dot"></div>
            <span>LM Studio</span>
          </div>
          <button id="lms-refresh" title="Refresh">⟳</button>
        </div>
        <div id="lmstudio-body">
          <div id="lms-badge"></div>
          <select id="lms-select" disabled>
            <option value="">— not connected —</option>
          </select>
          <label class="lms-max-row" for="lms-max-tokens">
            <span class="lms-max-label">Max output tokens</span>
            <input id="lms-max-tokens" type="number" min="256" max="262144" step="256" value="8192" title="Saved per model when you click Use" />
          </label>
          <div id="lms-actions">
            <button id="lms-load-btn" disabled>Load</button>
            <button id="lms-use-btn" disabled>Use</button>
          </div>
          <div id="lms-msg"></div>
        </div>
      </div>

    </div>

    <div id="tools-panel" class="sidebar-panel hidden">
      <div id="tools-panel-header">
        <span class="panel-title">MCP Servers</span>
        <div class="tools-panel-actions">
          <a href="/ui/mcp-guide.html" class="mcp-guide-link" title="How to build MCP servers">Guide</a>
          <button id="add-server-btn" title="Add server">+</button>
        </div>
      </div>
      <div id="server-list"></div>

      <div id="native-section">
        <span class="panel-title">Native tools</span>
        <div id="native-list"></div>
      </div>
    </div>

  </aside>

  <main id="main">

    <section id="chat-main">
      <div id="chat-header">
        <span id="chat-title"></span>
        <span id="chat-badge"></span>
      </div>

      <div id="messages">
        <div class="empty-state">
          <div class="empty-icon">⬡</div>
          <p>Select a conversation or create a new one</p>
        </div>
      </div>

      <div id="input-area">
        <div id="input-inner">
          <textarea id="msg-input" placeholder="Message…  (Ctrl+Enter to send)" rows="2" disabled></textarea>
          <button id="send-btn" disabled>Send</button>
        </div>
      </div>
    </section>

    <section id="tools-main" class="hidden">

      <div id="tools-empty" class="tools-state">
        <div class="empty-icon">⬢</div>
        <p>Select a server, or add a new one</p>
        <p class="tools-empty-hint"><a href="/ui/mcp-guide.html">How to create MCP servers</a></p>
      </div>

      <div id="server-detail" class="hidden">
        <div class="sd-header">
          <h2 id="sd-name"></h2>
          <span id="sd-badge"></span>
        </div>
        <div id="sd-meta" class="sd-meta"></div>
        <div class="sd-actions">
          <button id="sd-discover-btn">Discover tools</button>
          <button id="sd-edit-btn">Edit</button>
          <button id="sd-delete-btn" class="danger">Delete</button>
        </div>
        <h3 class="section-heading">Tools</h3>
        <div id="sd-tools-list"></div>
      </div>

      <div id="server-form" class="hidden">
        <h2 id="sf-title">Add MCP Server</h2>

        <div class="form-grid">
          <label class="form-row">
            <span class="form-label">Name</span>
            <input id="sf-name" type="text" placeholder="my_server" />
          </label>

          <label class="form-row">
            <span class="form-label">Description</span>
            <input id="sf-desc" type="text" placeholder="What this server does" />
          </label>

          <label class="form-row">
            <span class="form-label">Transport</span>
            <select id="sf-transport">
              <option value="stdio">stdio</option>
              <option value="http">http</option>
            </select>
          </label>

          <div id="sf-stdio" class="form-row">
            <span class="form-label">Command &amp; args</span>
            <input id="sf-command" type="text" placeholder="python" />
            <textarea id="sf-args" rows="3" placeholder="One arg per line"></textarea>
          </div>

          <div id="sf-http" class="form-row hidden">
            <span class="form-label">URL</span>
            <input id="sf-url" type="text" placeholder="https://example.com/mcp" />
          </div>

          <label class="form-row">
            <span class="form-label">Allowed profiles</span>
            <textarea id="sf-profiles" rows="3" placeholder="One profile per line"></textarea>
          </label>

          <label class="form-row">
            <span class="form-label">Environment</span>
            <textarea id="sf-env" rows="3" placeholder="KEY=value"></textarea>
          </label>

          <label class="form-row inline">
            <input id="sf-approval" type="checkbox" />
            <span>Require approval before tool execution</span>
          </label>

          <label class="form-row">
            <span class="form-label">Timeout (seconds)</span>
            <input id="sf-timeout" type="number" min="1" />
          </label>

          <label class="form-row">
            <span class="form-label">Output limit (chars)</span>
            <input id="sf-limit" type="number" min="100" />
          </label>
        </div>

        <div class="form-actions">
          <button id="sf-save-btn" class="primary">Save</button>
          <button id="sf-cancel-btn">Cancel</button>
          <span id="sf-msg"></span>
        </div>
      </div>

    </section>

  </main>
</div>
<script src="/ui/app.js?v=6"></script>
</body>
</html>
