<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAgents</title>
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>
<div id="app">

  <!-- ══════════ SIDEBAR ══════════ -->
  <aside id="sidebar">

    <div id="sidebar-top">
      <span id="logo">VAgents</span>
      <div id="nav-tabs">
        <button id="tab-chat" class="nav-tab active">Chat</button>
        <button id="tab-tools" class="nav-tab">Tools</button>
      </div>
    </div>

    <!-- CHAT PANEL -->
    <div id="chat-panel">
      <div id="new-chat-bar">
        <button id="new-chat-btn">+ New Chat</button>
      </div>

      <div id="new-chat-form">
        <input id="new-chat-name" type="text" placeholder="Chat name" maxlength="60" />
        <select id="new-chat-profile"></select>
        <div class="row-btns">
          <button id="new-chat-confirm">Create</button>
          <button id="new-chat-cancel" class="btn-ghost">Cancel</button>
        </div>
      </div>

      <div id="chat-list"></div>

      <div id="lmstudio-panel">
        <div id="lmstudio-header">
          <div class="lms-label-row">
            <div id="lms-dot"></div>
            <span>LM Studio</span>
          </div>
          <button id="lms-refresh" title="Refresh">⟳</button>
        </div>
        <div id="lmstudio-body">
          <div id="lms-badge"></div>
          <select id="lms-select" disabled>
            <option value="">— not connected —</option>
          </select>
          <div class="row-btns">
            <button id="lms-load-btn" disabled>Load</button>
            <button id="lms-use-btn" disabled>Use</button>
          </div>
          <div id="lms-msg"></div>
        </div>
      </div>
    </div><!-- /chat-panel -->

    <!-- TOOLS PANEL -->
    <div id="tools-panel">
      <div class="section-header">
        <span>MCP Servers</span>
        <button id="add-server-btn" class="btn-add">+ Add</button>
      </div>
      <div id="server-list"></div>

      <div class="section-header">
        <span>Native Tools</span>
      </div>
      <div id="native-list"></div>
    </div><!-- /tools-panel -->

  </aside>

  <!-- ══════════ MAIN ══════════ -->
  <main id="main">

    <!-- CHAT MAIN -->
    <div id="chat-main">
      <div id="chat-header">
        <span id="chat-title"></span>
        <span id="chat-badge"></span>
      </div>

      <div id="messages">
        <div class="empty-state">
          <div class="empty-icon">⬡</div>
          <p>Select a conversation or create a new one</p>
        </div>
      </div>

      <div id="input-area">
        <textarea id="msg-input" placeholder="Message…  (Ctrl+Enter to send)" rows="2" disabled></textarea>
        <button id="send-btn" disabled>Send</button>
      </div>
    </div>

    <!-- TOOLS MAIN -->
    <div id="tools-main">

      <!-- empty state -->
      <div id="tools-empty" class="empty-state-center">
        <div class="empty-icon">⬡</div>
        <p>Select a server or add a new one</p>
      </div>

      <!-- server detail -->
      <div id="server-detail">
        <div id="sd-header">
          <div class="sd-title-row">
            <span id="sd-name"></span>
            <span id="sd-badge"></span>
          </div>
          <div class="sd-actions">
            <button id="sd-discover-btn" class="btn-ghost">Discover Tools</button>
            <button id="sd-edit-btn" class="btn-ghost">Edit</button>
            <button id="sd-delete-btn" class="btn-ghost btn-danger">Delete</button>
          </div>
        </div>
        <div id="sd-meta"></div>
        <div id="sd-tools">
          <div class="section-label">Tools</div>
          <div id="sd-tools-list"></div>
        </div>
      </div>

      <!-- add / edit form -->
      <div id="server-form">
        <div id="sf-title">Add MCP Server</div>

        <div id="sf-fields">
          <label>Name <small>(lowercase_underscores)</small>
            <input id="sf-name" type="text" placeholder="my_mcp_server" />
          </label>

          <label>Description
            <input id="sf-desc" type="text" placeholder="What this server does" />
          </label>

          <label>Transport
            <select id="sf-transport">
              <option value="stdio">stdio — local process</option>
              <option value="streamable_http">streamable_http — remote URL</option>
            </select>
          </label>

          <div id="sf-stdio">
            <label>Command
              <input id="sf-command" type="text" placeholder="python" />
            </label>
            <label>Args <small>(one per line)</small>
              <textarea id="sf-args" rows="3" placeholder="./app/mcp_servers/examples/my_server.py"></textarea>
            </label>
          </div>

          <div id="sf-http">
            <label>URL
              <input id="sf-url" type="text" placeholder="http://localhost:8088/mcp" />
            </label>
          </div>

          <label>Allowed Profiles <small>(one per line)</small>
            <textarea id="sf-profiles" rows="3" placeholder="cybersecurity_agent&#10;general_assistant"></textarea>
          </label>

          <label>Env Vars <small>(KEY=value, one per line)</small>
            <textarea id="sf-env" rows="2" placeholder="MY_VAR=value"></textarea>
          </label>

          <label class="label-inline">
            <input id="sf-approval" type="checkbox" checked />
            Require approval before tool runs
          </label>

          <div class="field-row">
            <label>Timeout (s)
              <input id="sf-timeout" type="number" value="60" min="5" max="600" />
            </label>
            <label>Output limit (chars)
              <input id="sf-limit" type="number" value="20000" min="1000" />
            </label>
          </div>
        </div>

        <div class="row-btns" style="margin-top:20px;">
          <button id="sf-save-btn" class="btn-primary">Save Server</button>
          <button id="sf-cancel-btn" class="btn-ghost">Cancel</button>
        </div>
        <div id="sf-msg"></div>
      </div>

    </div><!-- /tools-main -->

  </main>
</div>
<script src="/ui/app.js"></script>
</body>
</html>
